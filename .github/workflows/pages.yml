name: Pages

# Đăng bản demo tĩnh (docs/reference/daiviet-crm-q4.html, dữ liệu mô phỏng) lên GitHub Pages.
# Bản CRM thật cần máy chủ nên chạy trên Vercel, không chạy trên Pages.
on:
  push:
    branches: [main, claude/great-keller-r6thv5]
    paths: [docs/reference/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site
          cp docs/reference/daiviet-crm-q4.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
