<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đại Việt Showroom Quận 4 — CRM và CDP có AI</title>
<style>
:root{
  --page:#EEF1F6;--band:#C9D8EE;--card:#FFFFFF;--card-2:#F6F8FB;--line:#DDDBDA;--line-2:#E5E5E5;
  --text:#181818;--weak:#5C5C5C;--brand:#0176D3;--brand-d:#014486;--brand-soft:#E5F1FC;
  --ok:#2E844A;--ok-soft:#E6F4EA;--warn:#A96404;--warn-soft:#FEF1DE;--err:#BA0517;--err-soft:#FDE7E9;
  --ai:#7526E3;--ai-soft:#F2EAFE;--obj:#6E4FD6;--hdr:#FFFFFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0E141C;--band:#16243A;--card:#18212D;--card-2:#1E2936;--line:#2E3A48;--line-2:#27323F;
  --text:#E8EDF3;--weak:#A2AEBD;--brand:#4AA3F0;--brand-d:#8CC4F5;--brand-soft:#15304A;
  --ok:#5CC27C;--ok-soft:#163223;--warn:#F0A23B;--warn-soft:#3A2A12;--err:#F07A86;--err-soft:#3D1A20;
  --ai:#B38BF7;--ai-soft:#2A1E45;--obj:#9C86EC;--hdr:#141C27;}}
:root[data-theme="dark"]{
  --page:#0E141C;--band:#16243A;--card:#18212D;--card-2:#1E2936;--line:#2E3A48;--line-2:#27323F;
  --text:#E8EDF3;--weak:#A2AEBD;--brand:#4AA3F0;--brand-d:#8CC4F5;--brand-soft:#15304A;
  --ok:#5CC27C;--ok-soft:#163223;--warn:#F0A23B;--warn-soft:#3A2A12;--err:#F07A86;--err-soft:#3D1A20;
  --ai:#B38BF7;--ai-soft:#2A1E45;--obj:#9C86EC;--hdr:#141C27;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13.5px;line-height:1.45;padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:220px;background:linear-gradient(var(--band),var(--page));z-index:-1}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:4px}
a{color:var(--brand);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
svg.i{width:16px;height:16px;fill:currentColor;flex:none}

/* global header */
.gh{background:var(--hdr);display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line-2)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.search{flex:1;max-width:520px;margin:0 auto;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px 7px 32px;background:var(--card)}
.search svg{position:absolute;left:10px;top:9px;color:var(--weak)}
.gicons{display:flex;gap:4px;align-items:center}
.ib{width:32px;height:32px;border-radius:6px;border:0;background:none;display:grid;place-items:center;color:var(--weak);position:relative}
.ib:hover{background:var(--card-2)}
.ib.on{background:var(--ai-soft);color:var(--ai)}
.ava{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.badge-n{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 3px}

/* app nav */
.nav{background:var(--hdr);display:flex;align-items:stretch;border-bottom:3px solid var(--brand);box-shadow:0 2px 3px rgba(0,0,0,.06);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.appname{display:flex;align-items:center;gap:10px;padding:0 16px 0 14px;font-size:16px;font-weight:400;white-space:nowrap;border-right:1px solid var(--line-2)}
.waffle{display:grid;grid-template-columns:repeat(3,4px);gap:2.5px}
.waffle i{width:4px;height:4px;border-radius:50%;background:var(--weak)}
.nav button.tab{border:0;background:none;padding:11px 14px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;font-size:13.5px}
.nav button.tab:hover{background:var(--card-2)}
.nav button.tab[aria-selected="true"]{border-bottom-color:var(--brand-d);font-weight:600;background:var(--card-2)}
[data-theme="dark"] .nav button.tab[aria-selected="true"]{border-bottom-color:var(--brand)}

/* shell */
.shell{display:flex;gap:12px;padding:12px;align-items:flex-start}
#main{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 2px rgba(0,0,0,.05)}
.card+.card{margin-top:12px}
.ch{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.ch h2{font-size:14px;margin:0;font-weight:700}
.ch .r{margin-left:auto;display:flex;gap:6px}
.cb{padding:4px 14px 14px}
.oi{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:#fff;flex:none}
.oi.lg{width:40px;height:40px}
.oi svg{width:60%;height:60%;fill:#fff}

.btn{border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:4px;padding:5px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.brand:hover{background:var(--brand-d)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
[data-theme="dark"] .btn.brand,[data-theme="dark"] .btn.ai{color:#0E141C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.brand,:root:not([data-theme="light"]) .btn.ai{color:#0E141C}}
.btn:disabled{opacity:.55;cursor:default}
.bgroup{display:inline-flex}
.bgroup .btn{border-radius:0;margin-left:-1px}
.bgroup .btn:first-child{border-radius:4px 0 0 4px;margin-left:0}
.bgroup .btn:last-child{border-radius:0 4px 4px 0}

.pill{display:inline-block;padding:1px 8px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-err{background:var(--err-soft);color:var(--err)}.p-ai{background:var(--ai-soft);color:var(--ai)}.p-n{background:var(--card-2);color:var(--weak)}
.weak{color:var(--weak)}
.lbl{font-size:12px;color:var(--weak)}

/* page header */
.phd{display:flex;align-items:center;gap:12px;padding:14px 16px}
.phd .t small{display:block;font-size:12px;color:var(--weak)}
.phd .t b{font-size:18px;font-weight:700}
.phd .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hl{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line-2);padding:10px 16px 12px}
.hl div{padding-right:28px;min-width:120px}
.hl b{display:block;font-weight:400;font-size:13.5px;margin-top:1px}

/* grid */
.g{display:grid;gap:12px;align-items:start}
.g-8-4{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line-2)}
.kpis div{padding:12px 14px;border-left:1px solid var(--line-2)}
.kpis div:first-child{border-left:0}
.kpis strong{display:block;font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}

/* path */
.path{display:flex;padding:12px 16px 4px;gap:4px;overflow-x:auto}
.path span{flex:1;min-width:110px;text-align:center;padding:7px 18px;font-size:13px;background:var(--card-2);color:var(--weak);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);white-space:nowrap}
.path span:first-child{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);border-radius:14px 0 0 14px}
.path span:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10px 50%);border-radius:0 14px 14px 0}
.path .done{background:var(--ok-soft);color:var(--ok)}
.path .cur{background:var(--brand-d);color:#fff;font-weight:600}
.path .risk{background:var(--err);color:#fff;font-weight:600}
.pathnote{padding:6px 16px 14px;font-size:13px}

/* tabs inside card */
.tabs{display:flex;border-bottom:1px solid var(--line-2);padding:0 14px}
.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--brand);font-weight:600}

/* composer */
.comp{margin:12px 14px;border:1px solid var(--line);border-radius:6px}
.comp .ct{display:flex;border-bottom:1px solid var(--line-2);overflow-x:auto}
.comp .ct button{border:0;background:none;padding:8px 12px;font-size:13px;white-space:nowrap;border-bottom:2px solid transparent}
.comp .ct button[aria-selected="true"]{border-bottom-color:var(--brand);color:var(--brand);font-weight:600}
.comp textarea{display:block;width:100%;border:0;background:transparent;resize:vertical;min-height:58px;padding:10px 12px}
.comp .cf{display:flex;gap:6px;justify-content:flex-end;padding:8px;border-top:1px solid var(--line-2)}

/* timeline */
.tlh{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card-2);font-weight:600;font-size:13px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.tl{list-style:none;margin:0;padding:8px 14px}
.tl li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:8px 0;position:relative}
.tl li:not(:last-child)::before{content:"";position:absolute;left:11px;top:32px;bottom:-4px;width:2px;background:var(--line-2)}
.tl .oi{width:24px;height:24px;border-radius:50%}
.tl .tt{font-weight:600;color:var(--brand)}
.tl .sd{font-size:13px;color:var(--weak)}
.tl .dt{font-size:12px;color:var(--weak);white-space:nowrap}
.aisum{margin-top:6px;border-left:3px solid var(--ai);background:var(--ai-soft);padding:6px 10px;border-radius:0 4px 4px 0;font-size:13px}
.aisum b{color:var(--ai);font-weight:600}
.tl li.new{animation:hl 1.2s ease}
@keyframes hl{from{background:var(--brand-soft)}to{background:transparent}}

/* details */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:6px 14px 14px}
.fields div{padding:8px 0;border-bottom:1px solid var(--line-2)}
.fields b{display:block;font-weight:400}

/* ai cards */
.einc{border-top:3px solid var(--ai)}
.gauge{display:flex;align-items:center;gap:14px}
.gauge svg{flex:none}
.factors{list-style:none;padding:0;margin:10px 0 0}
.factors li{display:flex;gap:8px;padding:5px 0;font-size:13px;border-top:1px solid var(--line-2)}
.factors .w{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.nba{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px}
.nba h3{font-size:13.5px;margin:0 0 4px}
.nba p{margin:0 0 8px;font-size:13px;color:var(--weak)}
.nba .row{display:flex;gap:6px}

/* related list */
.rl{width:100%;border-collapse:collapse;font-size:13px}
.rl td{padding:6px 0;border-top:1px solid var(--line-2)}
.rl td:last-child{text-align:right}

/* list view */
.lvh{padding:14px 16px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lvh .t small{display:block;font-size:12px;color:var(--weak)}
.lvh .t b{font-size:18px}
.lvh .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.lvsub{padding:0 16px 10px;font-size:12px;color:var(--weak)}
.tw{overflow-x:auto}
table.lv{width:100%;border-collapse:collapse;min-width:820px}
table.lv th{text-align:left;font-weight:600;font-size:12px;color:var(--weak);background:var(--card-2);padding:7px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
table.lv td{padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.lv tr:hover td{background:var(--card-2)}
.score{display:inline-flex;align-items:center;gap:6px}
.score i{display:inline-block;width:48px;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.score i u{display:block;height:100%}

/* feed + approvals */
.feed{list-style:none;margin:0;padding:0 14px 8px;max-height:420px;overflow-y:auto}
.feed li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line-2)}
.feed li:first-child{border-top:0}
.feed .oi{width:24px;height:24px;border-radius:50%}
.feed .an{font-size:12px;color:var(--weak)}
.feed .dt{font-size:12px;color:var(--weak)}
.feed li.new{animation:hl 1.2s ease}
.appr{padding:10px 14px;border-top:1px solid var(--line-2)}
.appr:first-child{border-top:0}
.appr .row{display:flex;gap:6px;margin-top:8px}
.empty{padding:18px 14px;color:var(--weak);text-align:center}
.chart{padding:0 14px 12px}
.chart svg{width:100%;height:auto;display:block}

/* ai panel */
#ai{width:360px;flex:none;position:sticky;top:12px;height:calc(100vh - 150px);display:flex;flex-direction:column;border-top:3px solid var(--ai)}
#ai[hidden]{display:none}
.aih{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.aih b{font-size:14px}
.aih .ib{margin-left:auto}
.ctx{padding:6px 12px;font-size:12px;color:var(--weak);background:var(--card-2);border-bottom:1px solid var(--line-2)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m-u{align-self:flex-end;background:var(--brand);color:#fff;padding:8px 11px;border-radius:12px 12px 2px 12px;max-width:85%}
[data-theme="dark"] .m-u{color:#0E141C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m-u{color:#0E141C}}
.m-a{align-self:flex-start;background:var(--card-2);border:1px solid var(--line-2);padding:10px 12px;border-radius:2px 12px 12px 12px;max-width:100%}
.m-a p{margin:0 0 6px}.m-a p:last-child{margin:0}
.m-a .draft{background:var(--card);border:1px dashed var(--ai);border-radius:6px;padding:8px 10px;margin:6px 0 8px;white-space:pre-line}
.m-a .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.m-a .hb{display:grid;grid-template-columns:1fr 70px 34px;gap:6px;align-items:center;font-size:12.5px;margin:4px 0}
.m-a .hb i{display:block;height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}
.m-a .hb i u{display:block;height:100%;background:var(--ai)}
.sug{display:flex;flex-direction:column;gap:6px;padding:8px 12px;border-top:1px solid var(--line-2)}
.sug button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:5px 11px;font-size:12.5px;color:var(--ai)}
.sug button:hover{background:var(--ai-soft)}
.aiin{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line-2)}
.aiin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:6px 9px;background:var(--card)}
.typing{color:var(--weak);font-style:italic}

/* utility bar */
.util{position:fixed;left:0;right:0;bottom:0;background:var(--hdr);border-top:1px solid var(--line);display:flex;gap:2px;padding:0 8px env(safe-area-inset-bottom,0px);z-index:20}
.util button{border:0;background:none;padding:10px 12px;display:flex;align-items:center;gap:6px;font-size:12.5px;border-right:1px solid var(--line-2)}
.util button:hover{background:var(--card-2)}
.util .cnt{background:var(--err);color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
.pop{position:fixed;left:8px;bottom:calc(44px + env(safe-area-inset-bottom,0px));width:380px;max-width:calc(100vw - 16px);max-height:60vh;overflow-y:auto;z-index:21;box-shadow:0 -2px 12px rgba(0,0,0,.15)}
.pop[hidden]{display:none}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-20px);background:var(--ok);color:#fff;padding:10px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:92vw;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* chips / filters */
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.fchips button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:3px 11px;font-size:12.5px}
.fchips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
.steps{display:flex;gap:4px;margin:6px 0 12px}
.steps span{flex:1;text-align:center;font-size:12px;padding:5px 2px;border-radius:4px;background:var(--card-2);color:var(--weak)}
.steps .d{background:var(--ok-soft);color:var(--ok);font-weight:600}
.steps .c{background:var(--brand);color:#fff;font-weight:600}
.box-ai{border-left:3px solid var(--ai);background:var(--ai-soft);padding:8px 10px;border-radius:0 4px 4px 0;font-size:13px;margin-top:8px}
.box-ai b{color:var(--ai)}
tr.sel td{background:var(--brand-soft)!important}
table.lv tbody tr{cursor:pointer}
/* inbox */
.inbox{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;height:calc(100vh - 170px);min-height:540px}
.ibl{border-right:1px solid var(--line-2);overflow-y:auto}
.ibl button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-2);background:none;padding:10px 12px}
.ibl button:hover{background:var(--card-2)}
.ibl button[aria-current="true"]{background:var(--brand-soft);box-shadow:inset 3px 0 var(--brand)}
.ibl .l1{display:flex;gap:6px;align-items:center}
.ibl .l1 b{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibl .pv{font-size:12.5px;color:var(--weak);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 4px}
.conv{display:flex;flex-direction:column;min-width:0}
.convh{padding:10px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.convh .r{margin-left:auto;display:flex;gap:6px}
.trs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card-2)}
.bb{max-width:78%;padding:8px 11px;border-radius:12px;font-size:13.5px}
.bb small{display:block;font-size:11px;opacity:.75;margin-bottom:2px}
.bb.cu{align-self:flex-start;background:var(--card);border:1px solid var(--line-2);border-radius:2px 12px 12px 12px}
.bb.ag{align-self:flex-end;background:var(--ai-soft);border-radius:12px 2px 12px 12px}
.bb.hu{align-self:flex-end;background:var(--brand);color:#fff;border-radius:12px 2px 12px 12px}
[data-theme="dark"] .bb.hu{color:#0E141C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bb.hu{color:#0E141C}}
.sys{align-self:center;font-size:12px;color:var(--weak);background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:3px 10px;text-align:center;max-width:90%}
.reply{border-top:1px solid var(--line-2);padding:10px;display:flex;gap:6px}
.reply textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:7px 9px;resize:none;height:40px;background:var(--card)}
.cop{border-left:1px solid var(--line-2);overflow-y:auto;padding:12px}
.cop h3{font-size:13px;margin:12px 0 6px}
.cop h3:first-child{margin-top:0}
.sr{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 9px;font-size:12.5px;margin-bottom:6px}
.sr:hover{border-color:var(--ai);background:var(--ai-soft)}
.meter{display:flex;gap:3px;margin-top:4px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line-2)}
/* reports */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rgrid .card+.card{margin-top:0}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}
.hbar i{display:block;height:12px;border-radius:3px;background:var(--line-2);overflow:hidden}
.hbar i u{display:block;height:100%}
.funnel div{margin:6px 0}

  else{const a=rand(act),e=rand(EV[a.id])();a.n++;G.auto++;if(e.rev)G.rev+=e.rev;if(e.newLead)G.leads++;FEED.unshift({a,t:e.t,r:e.r,money:!!e.rev,time:fmt(mins),fresh:true});FEED.length=Math.min(FEED.length,40)}
  clocks();refreshLive();
}
function clocks(){$('#clkVN').textContent=fmt(mins);$('#clkKR').textContent=fmt(mins+120)}
function start(){timer=setInterval(step,3200)}
function refreshLive(){
  $('#uQN').textContent=QUEUE.length;$('#bellN').textContent=QUEUE.length;
  if(route.v==='home'){renderFeed();renderQueue('#homeQueue');renderGoal()}
  if(!$('#popQueue').hidden)renderQueue('#popQueue',true);
  if(!$('#popLog').hidden)renderLog();
  if(route.v==='agents'){AG.forEach(a=>{const el=document.querySelector(`[data-an="${a.id}"]`);if(el)el.textContent=a.n});const tb=$('#decTb');if(tb){tb.innerHTML=decisionList();bindTrace()}}
}
function decide(id,ok){
  const i=QUEUE.findIndex(q=>q.id===id);if(i<0)return;const q=QUEUE.splice(i,1)[0];mins++;
  if(ok){G.auto++;FEED.unshift({a:q.a,t:q.e.ok,r:'QLSR đã duyệt',time:fmt(mins),fresh:true});toast(q.e.ok)}
  else{FEED.unshift({a:q.a,t:'Từ chối: '+q.e.t,r:'Từ chối',time:fmt(mins),fresh:true});toast('Đã từ chối. Agent ghi nhận để điều chỉnh')}
  refreshLive();
}
function renderFeed(){const el=$('#feed');if(!el)return;
  el.innerHTML=FEED.slice(0,20).map(f=>{const c=`<li class="${f.fresh&&!reduce?'new':''}"><span class="oi" style="background:${f.a.c}">${IC.spark}</span><div><div class="an">${f.a.name}</div><div>${esc(f.t)}</div></div><div style="text-align:right"><div class="dt">${f.time}</div><span class="pill ${f.money?'p-ok':'p-n'}">${esc(f.r)}</span></div></li>`;f.fresh=false;return c}).join('')||'<div class="empty">Chưa có hoạt động.</div>'}
function renderQueue(sel,head){const el=$(sel);if(!el)return;
  el.innerHTML=(head?`<div class="ch"><h2>Chờ QLSR duyệt (${QUEUE.length})</h2></div>`:'')+(QUEUE.length?QUEUE.map(q=>`<div class="appr"><div class="an lbl">${q.a.name}, ${q.time}</div><div>${esc(q.e.t)}</div><span class="pill p-warn" style="margin-top:6px">Cần duyệt: ${esc(q.e.why)}</span><div class="row"><button class="btn brand" data-ok="${q.id}">Duyệt</button><button class="btn" data-no="${q.id}">Từ chối</button></div></div>`).join(''):'<div class="empty">Không có việc chờ duyệt.</div>');
  el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>decide(b.dataset.ok,true));

  if(route.v==='convos')bindConvos();
  if(route.v==='reports')$('#rpAsk').onclick=()=>{openAi();aiAsk('Tóm tắt báo cáo này')};
  if(route.v==='agents'){document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const a=ag(b.dataset.tog);a.on=!a.on;b.textContent=a.on?'Đang chạy':'Đã tắt';b.classList.toggle('brand',a.on);toast(a.on?`Đã bật ${a.name}`:`Đã tắt ${a.name}`)});bindTrace()}
}
function bindConvos(){
  const c=CONV.find(x=>x.id===vSel);
  document.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{vSel=b.dataset.cv;render()});
  const t=$('#trs');t.scrollTop=t.scrollHeight;
  document.querySelectorAll('[data-sr]').forEach(b=>b.onclick=()=>{if(c.st==='agent')c.st='human';const s=c.sug[b.dataset.sr];render();$('#rpTx').value=s;$('#rpTx').focus()});
  const tk=$('#cvTake');if(tk)tk.onclick=()=>{c.st='human';c.msgs.push(['sys','Nhân viên đã tiếp quản từ agent',fmt(mins)]);render();toast('Anh đã tiếp quản hội thoại')};
  const dn=$('#cvDone');if(dn)dn.onclick=()=>{c.st='done';render();toast('Đã đóng. AI lưu tóm tắt vào hồ sơ hộ')};
  $('#rpSend').onclick=()=>{const v=$('#rpTx').value.trim();if(!v)return;mins++;c.msgs.push(['hu',v,fmt(mins)]);if(c.st==='need')c.st='human';c.t=fmt(mins);render();
    if(c.follow){const f=c.follow,mo=c.moveOpp;delete c.follow;setTimeout(()=>{mins++;c.msgs.push(['cu',f,fmt(mins)]);c.msgs.push(['sys','AI: khách đồng ý video call. Đã tạo lịch 21:00 giờ Hàn cho My, chuyển cơ hội sang bước Demo',fmt(mins)]);c.sent=0;c.st='done';
      const o=OPPS.find(x=>x.id===mo);if(o){o.s=2;o.sc=78;o.next='Video call 21:00 giờ Hàn tối nay. My chuẩn bị demo phần massage chân như khách yêu cầu.'}
      FEED.unshift({a:ag('tele'),t:'Nguyễn Thị Thu đồng ý video call 21:00 giờ Hàn, cơ hội lên bước Demo',r:'Đã hẹn',time:fmt(mins),fresh:true});refreshLive();if(route.v==='convos')render();toast('Khách đã đồng ý video call')},reduce?200:2200)}};
  $('#rpTx').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#rpSend').click()}};
}

/* ---------- AI panel ---------- */
const SUG={home:['Còn bao xa tới mục tiêu 3 tỷ?','Hôm nay đội nên ưu tiên gì?','Kênh nào mang khách Hàn tốt nhất?'],
 opps:['Cơ hội nào sắp chốt?','Vì sao lead kẹt trước bước demo?','Gợi ý bước tiếp cho cơ hội đang chọn'],
 house:['Tóm tắt hộ gia đình này','Nên bán chéo gì cho hộ này?','Soạn tin cho người đặt ở Hàn'],
 orders:['Đơn nào có rủi ro trước dịp lễ?','Soạn tin cập nhật cho người tặng'],
 convos:['Tóm tắt hội thoại cần người','Khách ở Hàn lo ngại điều gì nhiều nhất?'],
 channels:['Nên dồn ngân sách vào kênh nào?','Ý tưởng nội dung tuần này'],
 reports:['Tóm tắt báo cáo này','Có đạt 3 tỷ cuối năm không?'],
 agents:['Agent nào cần chỉnh luật?','Chi phí AI hôm nay bao nhiêu?']};
function setCtx(t){$('#ctx').textContent='Đang xem: '+t;$('#sug').innerHTML=(SUG[route.v]||SUG.home).map(x=>`<button>${x}</button>`).join('');$('#sug').querySelectorAll('button').forEach(b=>b.onclick=()=>aiAsk(b.textContent))}
function aiAnswer(q){
  const t=q.toLowerCase(),h=hh(houseSel),o=OPPS.find(x=>x.id===oppSel)||OPPS[0],od=ORD.find(x=>x.id===ordSel);
  if(t.includes('3 tỷ')&&t.includes('bao xa'))return `<p>Đã đạt <b>${ty(G.rev)}</b>, còn ${ty(GOAL-G.rev)} trong ${DAYS} ngày, tức khoảng <b>${tr((GOAL-G.rev)/DAYS)}/ngày</b>, tương đương 1 ghế DV-S7 mỗi 1,5 ngày.</p><p>Pipeline đang mở ${tr(OPPS.filter(x=>x.s<5).reduce((a,x)=>a+x.v,0))}. Điểm nghẽn không phải lead mà là bước từ Đã liên hệ sang Demo.</p>`;
  if(t.includes('ưu tiên'))return `<p>Ba việc đáng làm nhất hôm nay:</p><p>1. Tối nay 21:00 giờ Hàn, My video call với chị Thu (DV-X9, 79,9tr). Khách lo niềm tin, không lo giá.</p><p>2. Thảo gọi anh Phúc trước 13/10 để kịp quà 20/10.</p><p>3. Vy hoàn tất video bàn giao hộ Bùi. Mỗi video vừa giữ khách cũ vừa thành quảng cáo.</p>`;
  if(t.includes('kênh')&&(t.includes('khách hàn')||t.includes('ngân sách')))return `<p>Facebook Ads nhắm người Việt tại Hàn vẫn là nguồn lead chính, nhưng chi phí mỗi đơn khoảng 1,9tr. KOC tại Hàn khoảng 2tr mỗi đơn, đổi lại tạo niềm tin tốt hơn.</p><p><b>Đề xuất:</b> giữ ngân sách Facebook, chuyển phần tăng thêm sang quảng cáo dùng video bàn giao khách thật cùng tỉnh, và bắt buộc mời video call trước khi báo giá.</p>`;
  if(t.includes('sắp chốt'))return `<p>${OPPS.filter(x=>x.s>=3&&x.s<5).map(x=>`<b>${x.n}</b> (${x.p.replace('Ghế massage ','')}, ${tr(x.v)}, điểm ${x.sc}): ${x.next}`).join('</p><p>')}</p>`;
  if(t.includes('kẹt'))return `<p>Lead từ Hàn kẹt trước bước demo vì khách chưa tin mua từ xa. Khách đã video call chốt 48%, khách chỉ nhận báo giá qua tin chốt 12%.</p><p>Nên đổi kịch bản tele: không gửi giá trước, mà hẹn video call với showroom trong 48 giờ đầu.</p>`;
  if(t.includes('bước tiếp'))return `<p><b>${o.n}</b>: ${o.next}</p>`;
  if(t.includes('tóm tắt hộ'))return `<p><b>${h.name}, ${h.place}</b>: ${h.mem.length} thành viên. ${h.mem.filter(m=>m.loc==='KR').map(m=>`${m.n} ở ${m.city} là người trả tiền`).join('; ')||'Không có thành viên ở Hàn'}.</p><p>${h.owned.length?'Đã có: '+h.owned.map(x=>x[0]).join(', ')+'.':'Chưa mua sản phẩm nào.'} ${h.trust[0]}.</p><p><b>Cơ hội lớn nhất:</b> ${h.cross[0].t.toLowerCase()}.</p>`;
  if(t.includes('bán chéo'))return h.cross.map(c=>`<p><b>${c.t}</b> (${tr(c.v)}): ${c.d}</p>`).join('');
  if(t.includes('soạn tin')&&route.v==='house'){const m=h.mem.find(x=>x.role==='Người đặt')||h.mem[0];const f=m.n.split(' ').pop();return `<p>Bản nháp gửi ${m.n}:</p><div class="draft">${h.owned.length?`Chào ${m.rel==='Con gái'?'chị':'anh'} ${f}, Đại Việt Quận 4 đây ạ. Ghế của hai bác ở nhà vẫn dùng tốt chứ ạ? Tháng 11 là sinh nhật 70 tuổi của bác trai, nếu ${m.rel==='Con gái'?'chị':'anh'} muốn chuẩn bị quà mừng thọ, bên em có máy lọc nước ion kiềm rất hợp với nhà dùng nước giếng. Em gửi ${m.rel==='Con gái'?'chị':'anh'} thông tin nhé.`:`Chào ${m.rel==='Con gái'?'chị':'anh'} ${f}, em là My ở showroom Đại Việt Quận 4. Em gửi ${m.rel==='Con gái'?'chị':'anh'} video bàn giao của các cô chú ở cùng tỉnh. Nếu tiện, tối nay em gọi video cho ${m.rel==='Con gái'?'chị':'anh'} xem ghế thật nhé.`}</div><div class="row"><button class="btn ai" data-sendz>Gửi qua Zalo</button></div>`}
  if(t.includes('rủi ro'))return `<p>${ORD.filter(x=>x.flag).map(x=>`<b>${x.id}</b> (${x.buyer}): ${x.flag}. ${x.note}`).join('</p><p>')}</p><p>Với đơn Tết, đội lắp đặt tuyến miền Trung cần chốt lịch trước 15/12.</p>`;
  if(t.includes('cập nhật cho người tặng'))return `<p>Bản nháp cho ${od.buyer}:</p><div class="draft">Chào anh chị, Đại Việt cập nhật đơn ${od.id}: hiện đang ở bước "${OSTEP[Math.min(od.s,4)]}", hẹn giao ${od.eta}. Lắp xong em gửi video bàn giao tại nhà ${od.recv.split('(')[1]?.replace(')','')||'người nhận'} ngay ạ.</div><div class="row"><button class="btn ai" data-sendz>Gửi qua Zalo</button></div>`;
  if(t.includes('cần người'))return CONV.filter(c=>c.st==='need').map(c=>`<p><b>${c.cn}</b> (${c.ch}, ${c.loc}): ${c.sum}</p>`).join('')||'<p>Không còn hội thoại cần người.</p>';
  if(t.includes('lo ngại'))return `<p>Từ hội thoại 30 ngày với khách ở Hàn, ba lo ngại lớn nhất:</p><div class="hb"><span>Sợ mua từ xa bị lừa</span><i><u style="width:44%"></u></i><b>44%</b></div><div class="hb"><span>Giao lắp tỉnh xa</span><i><u style="width:31%"></u></i><b>31%</b></div><div class="hb"><span>Bảo hành khi mình ở Hàn</span><i><u style="width:25%"></u></i><b>25%</b></div><p style="margin-top:6px">Cả ba đều là bài toán niềm tin. Video call, video bàn giao và bảo hành điện tử gửi về Zalo người tặng giải được cả ba.</p>`;
  if(t.includes('nội dung'))return `<p>Ba ý tưởng cho tuần này:</p><p>1. "Gọi về cho mẹ": quay khách ở Hàn video call với bố mẹ đang ngồi ghế.</p><p>2. Live Thứ Bảy: kỹ thuật viên lắp ghế thật, trả lời giao lắp tỉnh xa.</p><p>3. Clip 30 giây cho 20/10: món quà con gửi từ Hàn về.</p>`;
  if(t.includes('báo cáo'))return `<p>Ba điểm chính:</p><p>1. 78% doanh thu đến từ người đặt ở Hàn, đúng trọng tâm.</p><p>2. Nút thắt là bước Đã liên hệ sang Demo; video call là đòn bẩy lớn nhất.</p><p>3. 86% hộ mới mua một sản phẩm. Bán chéo máy lọc nước cho hộ đã có ghế là doanh thu rẻ nhất.</p>`;
  if(t.includes('đạt 3 tỷ'))return `<p>Có thể, nếu tháng 12 đạt khoảng 1,45 tỷ. Điều kiện:</p><p>1. Từ giữa tháng 10 nuôi lead Tết, vì khách ở Hàn cân nhắc 3–6 tuần.</p><p>2. Tỷ lệ chốt sau video call giữ trên 40%.</p><p>3. Đội lắp đặt đủ năng lực cho khoảng 25 ghế trong 2 tuần cao điểm trước Tết.</p><p>Rủi ro lớn nhất không phải lead mà là năng lực giao lắp tỉnh xa sát Tết.</p>`;
  if(t.includes('chỉnh luật'))return `<p><b>Agent Trợ lý tele</b> đẩy nhiều việc duyệt nhất vì ngưỡng giảm giá 5% thấp với dòng DV-X9. Đề xuất: cho phép tới 7% với DV-X9 khi khách có dịp tặng rõ ràng, giữ 5% cho dòng khác.</p>`;
  if(t.includes('chi phí ai'))return `<p>Hôm nay đến ${fmt(mins)}, khoảng ${Math.round(G.auto*70+12000).toLocaleString('vi-VN')}đ cho ${G.auto} việc. Rất nhỏ so với một đơn ghế; chi phí đáng theo dõi là quảng cáo và phí tin nhắn.</p>`;
  return `<p>Bản demo trả lời được các câu hỏi gợi ý bên dưới. Trong hệ thật, câu hỏi được dịch thành truy vấn trên dữ liệu hộ gia đình, lead, đơn và hội thoại.</p>`;
}
function aiAsk(q){
  if(!q.trim())return;const box=$('#msgs');box.insertAdjacentHTML('beforeend',`<div class="m-u">${esc(q)}</div>`);
  const a=document.createElement('div');a.className='m-a';a.innerHTML='<span class="typing">Đang đọc dữ liệu…</span>';box.append(a);box.scrollTop=box.scrollHeight;
  setTimeout(()=>{a.innerHTML=aiAnswer(q);box.scrollTop=box.scrollHeight;a.querySelectorAll('[data-sendz]').forEach(x=>x.onclick=()=>{x.disabled=true;x.textContent='Đã gửi';toast('Đã gửi tin Zalo')})},reduce?80:800);
}
function openAi(){$('#ai').hidden=false;$('#aiToggle').classList.add('on')}
$('#aiToggle').onclick=()=>{const h=!$('#ai').hidden;$('#ai').hidden=h;$('#aiToggle').classList.toggle('on',!h)};
$('#aiClose').onclick=()=>{$('#ai').hidden=true;$('#aiToggle').classList.remove('on')};
$('#aiSend').onclick=()=>{aiAsk($('#aiIn').value);$('#aiIn').value=''};
$('#aiIn').onkeydown=e=>{if(e.key==='Enter')$('#aiSend').click()};
$('#uQueue').onclick=()=>{$('#popLog').hidden=true;const p=$('#popQueue');p.hidden=!p.hidden;if(!p.hidden)renderQueue('#popQueue',true)};
$('#bell').onclick=$('#uQueue').onclick;
$('#uLog').onclick=()=>{$('#popQueue').hidden=true;const p=$('#popLog');p.hidden=!p.hidden;if(!p.hidden)renderLog()};
$('#uPause').onclick=()=>{paused=!paused;if(paused){clearInterval(timer);$('#uPauseT').textContent='Chạy tiếp agent';toast('Đã tạm dừng toàn bộ agent')}else{start();$('#uPauseT').textContent='Tạm dừng agent';toast('Agent chạy tiếp')}};
$('#gsearch').onkeydown=e=>{if(e.key!=='Enter')return;const v=e.target.value.trim().toLowerCase();if(!v)return;const h=HOUSES.find(x=>x.mem.some(m=>m.n.toLowerCase().includes(v)||m.ph.includes(v))||x.name.toLowerCase().includes(v));if(h)openHouse(h.id);else toast('Không tìm thấy trong dữ liệu demo')};
document.querySelectorAll('.nav .tab').forEach(t=>t.onclick=()=>go(t.dataset.go));
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

if(matchMedia('(max-width:1100px)').matches){$('#ai').hidden=true;$('#aiToggle').classList.remove('on')}
$('#msgs').innerHTML='<div class="m-a"><p>Chào anh. Em đọc được dữ liệu lead, hộ gia đình, đơn giao lắp và hội thoại của showroom Quận 4, cả khách ở Việt Nam lẫn Hàn Quốc.</p></div>';
for(let i=0;i<10;i++)step();FEED.forEach(f=>f.fresh=false);
clocks();render();start();
})();
</script>
